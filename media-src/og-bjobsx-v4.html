<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<!-- og-bjobsx-v4 (14 Nov 2026): product card for the jobs home. Live features only; no amounts. Render 1200x630. -->
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px}
body{background:#050505;color:#f4f1e8;font-family:'IBM Plex Sans',system-ui,sans-serif;position:relative;overflow:hidden}
.bg{position:absolute;right:-60px;top:-40px;width:820px;height:720px;background:url(https://tokenblaster.lol/arcade/gallery.jpg) center/cover;filter:blur(26px) brightness(.38) saturate(1.2);opacity:.9}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050505 4%,rgba(5,5,5,.2) 55%,rgba(5,5,5,.55))}
.tint{position:absolute;inset:0;background:radial-gradient(48% 70% at 74% 46%,rgba(255,210,77,.20),transparent 70%),linear-gradient(90deg,#050505 34%,transparent 62%)}
.logo{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:12px;font:700 34px/1 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em}
.logo svg{width:40px;height:40px}
.beta{font:600 13px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.14em;color:#ffd24d;border:1.5px solid rgba(255,210,77,.55);border-radius:999px;padding:4px 10px;margin-left:6px}
.eye{position:absolute;left:72px;top:150px;font:600 17px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.2em;color:#ffd24d}
h1{position:absolute;left:72px;top:186px;margin:0;width:560px;font:700 76px/1 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.045em;color:#fff}
h1 span{background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#c98f00);-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{position:absolute;left:72px;top:384px;width:560px;font:400 23px/1.4 'IBM Plex Sans',system-ui,sans-serif;color:#d8d3c5}
.pill{position:absolute;left:72px;top:478px;background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#e0a800);color:#000;border-radius:999px;padding:16px 30px;font:700 23px/1 'Space Grotesk',system-ui,sans-serif}
.url{position:absolute;left:72px;bottom:46px;font:500 21px 'Space Grotesk',system-ui,sans-serif;color:#8a877e}
.card{position:absolute;width:330px;height:452px;border-radius:22px;overflow:hidden;background:#0b0b0c;box-shadow:0 40px 90px -30px rgba(0,0,0,.95)}
.back{right:226px;top:118px;transform:rotate(-7deg);opacity:.55;border:1px solid rgba(255,255,255,.12)}
.front{right:92px;top:88px;transform:rotate(3deg);border:2px solid #ffd24d;box-shadow:0 40px 100px -30px rgba(255,210,77,.45),0 30px 60px -20px rgba(0,0,0,.9)}
.art{position:absolute;inset:0 0 44% 0;background:url(https://tokenblaster.lol/arcade/gallery.jpg) center/cover}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0b0b0c 3%,transparent 60%)}
.body{position:absolute;left:0;right:0;bottom:0;padding:20px 22px}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 14px 'Space Grotesk',system-ui,sans-serif;border:1.5px solid rgba(255,90,72,.7);background:rgba(0,0,0,.6);border-radius:999px;padding:4px 12px}
.chip i{width:8px;height:8px;border-radius:50%;background:#ff5a48}
.card h3{font:700 27px/1.12 'Space Grotesk',system-ui,sans-serif;margin:12px 0 8px;color:#fff}
.card p{font-size:16px;line-height:1.45;color:#cfcabd;margin:0 0 14px}
.foot{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;font:600 15px 'Space Grotesk',system-ui,sans-serif;color:#9a968b}
.foot b{color:#ffd24d}
</style></head><body>
<div class="bg"></div><div class="tint"></div>
<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="23 8 74 100" role="img" aria-label="bWalletX">  <!-- bWalletX logo: the bCorp flag-top b, gold on dark. No X in the logo (owner, 4 Oct 2026): the X lives in the title. -->  <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105"><stop offset="0" stop-color="#FFE58A"/><stop offset="0.55" stop-color="#FFD24D"/><stop offset="1" stop-color="#C98F00"/></linearGradient><mask id="h"><rect x="0" y="0" width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs>  <g fill="url(#g)" mask="url(#h)"><polygon points="45,12 45,76 27,76 27,30"/><circle cx="60" cy="72" r="33"/></g></svg><span>Jobs<span style="color:#ffd24d">X</span></span><span class="beta">BETA</span></div>
<div class="eye">PAID WORK · PAID IN BSV</div>
<h1>Small jobs, <span>paid in Bitcoin.</span></h1>
<div class="meta">Do the work, get paid in BSV to your own wallet when it&rsquo;s merged.</div>
<div class="pill">See open jobs</div>
<div class="url">bjobsx.com</div>
<div class="card back"><div class="art"></div></div>
<div class="card front">
  <div class="art"></div>
  <div class="body">
    <span class="chip"><i></i>TERRORNODE · Contract</span>
    <h3>Drone swarm enemy</h3>
    <p>A flock of flying erobot drones that circle and dive.</p>
    <div class="foot"><b>Paid on merge</b><span>About 1 hour with AI</span></div>
  </div>
</div>
</body></html>
