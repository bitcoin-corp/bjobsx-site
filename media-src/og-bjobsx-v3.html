<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#000;color:#f4f1e8;font-family:'IBM Plex Sans';position:relative;overflow:hidden}
body::before{content:"";position:absolute;right:-140px;top:10px;width:760px;height:660px;background:radial-gradient(closest-side,rgba(245,184,0,.24),transparent 70%)}
.logo{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:14px;font:700 34px/1 'Space Grotesk';letter-spacing:-.02em}
.logo svg{width:40px;height:40px}
.g{color:#ffd24d}
h1{position:absolute;left:72px;top:150px;margin:0;width:620px;font:700 78px/1 'Space Grotesk';letter-spacing:-.045em}
h1 span{background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#c98f00);-webkit-background-clip:text;color:transparent}
.steps{position:absolute;left:72px;top:418px;display:flex;gap:12px}
.steps div{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,210,77,.3);border-radius:999px;padding:10px 18px 10px 10px;font:600 20px/1 'Space Grotesk'}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#ffd24d;color:#000;display:grid;place-items:center;font:700 16px 'Space Grotesk'}
.foot{position:absolute;left:72px;bottom:50px;font:500 22px/1 'Space Grotesk';color:#8a877e}
.foot b{color:#f4f1e8;font-weight:500}
.card{position:absolute;right:66px;top:92px;width:380px;background:#0d0e11;border:1px solid #2a2c33;border-radius:22px;padding:24px;transform:rotate(3deg);box-shadow:0 40px 80px -30px rgba(245,184,0,.45)}
.top{display:flex;gap:14px;align-items:center}
.av{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffe08a,#d4af37 45%,#7a5a12);color:#0b0b0b;display:grid;place-items:center;font:700 26px 'Space Grotesk'}
.nm{font:700 24px/1.1 'Space Grotesk'}.hd{font-size:16px;color:#a9a69c;margin-top:4px}
.tl{margin:20px 0 0;padding:0 0 0 16px;border-left:2px solid rgba(255,210,77,.4);list-style:none}
.tl li{position:relative;padding:0 0 14px 12px}.tl li::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:#ffd24d}
.tl b{display:block;font:600 17px/1.2 'Space Grotesk'}.tl span{font-size:14px;color:#a9a69c}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:14px;border-top:1px solid #23252b;font:600 14px 'Space Grotesk';color:#a9a69c}
.seal{background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#e0a800);color:#000;border-radius:99px;padding:5px 11px;font:700 12px 'Space Grotesk';letter-spacing:.1em}
.lock{color:#6ee09a}
</style></head><body>
<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="23 8 74 100" role="img" aria-label="bWalletX">  <!-- bWalletX logo: the bCorp flag-top b, gold on dark. No X in the logo (owner, 4 Oct 2026): the X lives in the title. -->  <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105"><stop offset="0" stop-color="#FFE58A"/><stop offset="0.55" stop-color="#FFD24D"/><stop offset="1" stop-color="#C98F00"/></linearGradient><mask id="h"><rect x="0" y="0" width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs>  <g fill="url(#g)" mask="url(#h)"><polygon points="45,12 45,76 27,76 27,30"/><circle cx="60" cy="72" r="33"/></g></svg><span>bJobs<span class="g">X</span></span></div>
<h1>Your work history, in <span>your own wallet.</span></h1>
<div class="steps"><div><i>1</i>Connect bWalletX</div><div><i>2</i>Import LinkedIn</div><div><i>3</i>Mint</div></div>
<div class="foot"><b>bjobsx.com</b> · private by default · 1p a record</div>
<div class="card">
  <div class="top"><div class="av">A</div><div><div class="nm">Your name</div><div class="hd">$you · you@bwalletx.com</div></div></div>
  <ol class="tl">
    <li><b>Senior Engineer</b><span>2021 – Present</span></li>
    <li><b>Engineer</b><span>2016 – 2021</span></li>
    <li><b>BSc Computer Science</b><span>2011 – 2014</span></li>
  </ol>
  <div class="row"><span class="lock">● Locked to you</span><span class="seal">MINTED</span></div>
</div>
</body></html>
